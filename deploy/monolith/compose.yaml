# Local dependencies for running the monolith (go run ./cmd/gyoza) on any
# machine. From the repo root:
#
#   docker compose -f deploy/monolith/compose.yaml up -d --wait
#   docker compose -f deploy/monolith/compose.yaml down        # keeps data
#   docker compose -f deploy/monolith/compose.yaml down -v     # deletes data
#
# Then point the binaries and tests at it:
#   GYOZA_DATABASE_URL=postgres://gyoza:gyoza@localhost:5433/gyoza
#   GYOZA_TEST_S3_ENDPOINT=http://localhost:9000   (S3: access key gyoza, secret gyoza-dev-secret)

name: gyoza

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: gyoza
      POSTGRES_PASSWORD: gyoza # local development only
      POSTGRES_DB: gyoza
    ports:
      # 5433 on the host so it can run next to a locally installed Postgres on 5432.
      # Bound to localhost so the database isn't reachable from the network.
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker,
      # so the volume goes on the parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # `up --wait` blocks until this passes, so the database is ready to use.
      test: ["CMD", "pg_isready", "-U", "gyoza", "-d", "gyoza"]
      interval: 2s
      timeout: 5s
      retries: 15

  # S3-compatible storage for local runs and the blob tests. RustFS (Apache-2.0)
  # because MinIO no longer publishes community images. It validates presigned
  # signatures, including the signed size and content type, like S3 does.
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: gyoza
      RUSTFS_SECRET_KEY: gyoza-dev-secret # local development only
      RUSTFS_VOLUMES: /data
    ports:
      - "127.0.0.1:9000:9000" # S3 API
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  s3-data:
