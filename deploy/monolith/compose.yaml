# Local dependencies for running the monolith (go run ./cmd/modulith) on any
# machine. From the repo root:
#
#   docker compose -f deploy/monolith/compose.yaml up -d --wait
#   docker compose -f deploy/monolith/compose.yaml down        # keeps data
#   docker compose -f deploy/monolith/compose.yaml down -v     # deletes data
#
# Then point the binaries and tests at it:
#   MODULITH_DATABASE_URL=postgres://modulith:modulith@localhost:5433/modulith
#   MODULITH_TEST_S3_ENDPOINT=http://localhost:9000   (S3: access key modulith, secret modulith-dev-secret)
#   MODULITH_TEST_NATS_URL=nats://localhost:4222

name: modulith

services:
  # The monolith itself, in a container. Off by default: during development
  # it runs on the host (go run ./cmd/modulith). Start it with --profile app.
  # Presigned URLs then name http://s3:9000, which only containers resolve,
  # so uploads from the host need the host-run binary instead.
  app:
    profiles: [app]
    build:
      context: ../..
      target: modulith
    environment:
      MODULITH_DATABASE_URL: postgres://modulith:modulith@postgres:5432/modulith
      MODULITH_S3_ENDPOINT: http://s3:9000
      MODULITH_S3_ACCESS_KEY: modulith
      MODULITH_S3_SECRET_KEY: modulith-dev-secret # local development only
      MODULITH_S3_PATH_STYLE: "true"
      MODULITH_S3_BUCKET: modulith-dev
      MODULITH_S3_CREATE_BUCKET: "true"
      MODULITH_NATS_URL: nats://nats-1:4222,nats-2:4222,nats-3:4222
      MODULITH_SUPERTOKENS_URL: http://supertokens:3567
      MODULITH_PUBLIC_URL: http://localhost:8080
      # SuperTokens' public demo Google client: localhost only (see .env.example).
      MODULITH_GOOGLE_CLIENT_ID: 1060725074195-kmeum4crr01uirfl2op9kd5acmi9jutn.apps.googleusercontent.com
      MODULITH_GOOGLE_CLIENT_SECRET: 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
      MODULITH_GATEWAY_DEV_PAGES: "true"
      # SigNoz (deploy/observability) runs in WSL's Docker: reached through the
      # host, where WSL forwards its OTLP port. MODULITH_CONTAINER_OTLP_ENDPOINT=
      # (empty) turns telemetry off.
      MODULITH_OTLP_ENDPOINT: ${MODULITH_CONTAINER_OTLP_ENDPOINT-http://host.docker.internal:4317}
    extra_hosts:
      - host.docker.internal:host-gateway # Docker Desktop has it; Linux engines need this
    ports:
      - "127.0.0.1:9090:9090" # gRPC, as go run ./cmd/modulith serves it
      - "127.0.0.1:8080:8080" # the gateway (HTTP)
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }
      nats-1: { condition: service_started }
      nats-2: { condition: service_started }
      nats-3: { condition: service_started }
      supertokens: { condition: service_healthy }

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: modulith
      POSTGRES_PASSWORD: modulith # local development only
      POSTGRES_DB: modulith
    ports:
      # 5433 on the host so it can run next to a locally installed Postgres on 5432.
      # Bound to localhost so the database isn't reachable from the network.
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker,
      # so the volume goes on the parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # `up --wait` blocks until this passes, so the database is ready to use.
      test: ["CMD", "pg_isready", "-U", "modulith", "-d", "modulith"]
      interval: 2s
      timeout: 5s
      retries: 15

  # SuperTokens core: sign-in accounts and sessions, behind the gateway (which
  # alone talks to it). Its tables live in their own schema, supertokens, on
  # the same Postgres, like every service's. No API key: reachable from
  # localhost only.
  supertokens:
    image: supertokens/supertokens-postgresql:12.2.0
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://modulith:modulith@postgres:5432/modulith
      POSTGRESQL_TABLE_SCHEMA: supertokens
    ports:
      - "127.0.0.1:3567:3567"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && printf \"GET /hello HTTP/1.0\r\n\r\n\" >&3 && grep -q Hello <&3'"]
      interval: 2s
      timeout: 5s
      retries: 30

  # S3-compatible storage for local runs and the blob tests. RustFS (Apache-2.0)
  # because MinIO no longer publishes community images. It validates presigned
  # signatures, including the signed size and content type, like S3 does.
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: modulith
      RUSTFS_SECRET_KEY: modulith-dev-secret # local development only
      RUSTFS_VOLUMES: /data
    ports:
      - "127.0.0.1:9000:9000" # S3 API
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 30

# it is categorically a bad idea to run NATS in here.
# all messages in JetStream die with a crash -- total data loss
# but since we also have RustFS in here as S3 stand in, just yolo for
# now nothing matters
  nats-1:
    image: nats:2.14.6-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ../../platform/nats/nats-1.conf:/etc/nats/nats.conf:ro
      - nats1-data:/data
    ports:
      # Clients on the host connect here; the server tells them about the
      # other members, but they can only reach this one.
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nats-2:
    image: nats:2.14.6-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ../../platform/nats/nats-2.conf:/etc/nats/nats.conf:ro
      - nats2-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nats-3:
    image: nats:2.14.6-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ../../platform/nats/nats-3.conf:/etc/nats/nats.conf:ro
      - nats3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  s3-data:
  nats1-data:
  nats2-data:
  nats3-data:
