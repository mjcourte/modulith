# Regenerate after editing proto/: go generate ./contracts
version: v2
managed:
  enabled: true
  override:
    # modulith/storage/v1/x.proto -> package github.com/mjcourte/modulith/contracts/gen/go/modulith/storage/v1
    - file_option: go_package_prefix
      value: github.com/mjcourte/modulith/contracts/gen/go
plugins:
  # The generators are Go tool dependencies (see go.mod), so no separate install.
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: gen/go
    opt: paths=source_relative
