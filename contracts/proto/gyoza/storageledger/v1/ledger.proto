syntax = "proto3";

// The storage ledger: a ledger of every object stored in S3.
// Mirrors the Service interface in services/storageledger.
package gyoza.storageledger.v1;

import "google/protobuf/timestamp.proto";

service LedgerService {
  // Records a new object. The server assigns created_at, and id unless the
  // caller chose one. With a caller-chosen id it is idempotent: the same file
  // again returns the existing object; a different file is ALREADY_EXISTS.
  rpc CreateObject(CreateObjectRequest) returns (CreateObjectResponse);
  // Fails with NOT_FOUND if there is no such object.
  rpc GetObject(GetObjectRequest) returns (GetObjectResponse);
  // Lists objects in one scope, oldest first, one page at a time.
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);
  // Soft-deletes an object. Deleting twice keeps the first deletion time.
  rpc MarkObjectDeleted(MarkObjectDeletedRequest) returns (MarkObjectDeletedResponse);
  // Removes a deleted user as creator from every object.
  rpc ClearCreatedBy(ClearCreatedByRequest) returns (ClearCreatedByResponse);
  // Gives every object of one owner (deleted or not) to another, e.g. a
  // departing user's files to their org. Never to or from a project.
  rpc TransferOwner(TransferOwnerRequest) returns (TransferOwnerResponse);
  // Soft-deletes every live object of an owner, e.g. a deleted project's.
  rpc MarkDeletedByOwner(MarkDeletedByOwnerRequest) returns (MarkDeletedByOwnerResponse);
  // Lists objects deleted before a time, longest-deleted first, for the purge job.
  rpc ListDeletedObjects(ListDeletedObjectsRequest) returns (ListDeletedObjectsResponse);
  // Removes a deleted object for good once its bytes are gone. Missing is
  // fine; a live object is FAILED_PRECONDITION.
  rpc PurgeObject(PurgeObjectRequest) returns (PurgeObjectResponse);
}

message TransferOwnerRequest {
  Owner from = 1;
  Owner to = 2;
}

message TransferOwnerResponse {
  // How many objects moved.
  int64 count = 1;
}

message MarkDeletedByOwnerRequest {
  Owner owner = 1;
}

message MarkDeletedByOwnerResponse {
  // How many objects were newly deleted.
  int64 count = 1;
}

enum OwnerKind {
  OWNER_KIND_UNSPECIFIED = 0;
  OWNER_KIND_PROJECT = 1;
  OWNER_KIND_USER = 2;
  OWNER_KIND_ORG = 3;
  // Shared files owned by the platform; id is empty.
  OWNER_KIND_GYOZA = 4;
}

// The single principal that owns an object. Deleting it deletes what it owns.
message Owner {
  OwnerKind kind = 1;
  string id = 2;
}

message Object {
  string id = 1;
  Owner owner = 2;
  // Empty for platform-created objects, or once the creator is deleted.
  string created_by = 3;
  // Empty when not associated with a project.
  string project_id = 4;
  // What the object is used for: "snapshot", "asset", "export", ...
  string kind = 5;
  string bucket = 6;
  string key = 7;
  int64 size_bytes = 8;
  string content_type = 9;
  google.protobuf.Timestamp created_at = 10;
  // Unset until soft-deleted.
  google.protobuf.Timestamp deleted_at = 11;
}

message CreateObjectRequest {
  // id and created_at are ignored.
  Object object = 1;
}

message CreateObjectResponse {
  Object object = 1;
}

message GetObjectRequest {
  string id = 1;
}

message GetObjectResponse {
  Object object = 1;
}

message ListObjectsRequest {
  // Exactly one scope is required.
  oneof scope {
    string project_id = 1;
    Owner owner = 2;
  }
  // Optional filters; empty means unset.
  string created_by = 3;
  string kind = 4;
  bool include_deleted = 5;
  // 0 means the server default; larger values are capped.
  int32 page_size = 6;
  // next_page_token from the previous response; empty for the first page.
  string page_token = 7;
}

message ListObjectsResponse {
  repeated Object objects = 1;
  // Empty when there are no more pages.
  string next_page_token = 2;
}

message MarkObjectDeletedRequest {
  string id = 1;
}

message MarkObjectDeletedResponse {}

message ClearCreatedByRequest {
  string user_id = 1;
}

message ClearCreatedByResponse {
  // How many objects were changed.
  int64 count = 1;
}

message ListDeletedObjectsRequest {
  google.protobuf.Timestamp before = 1;
  // Between 1 and 500.
  int32 limit = 2;
}

message ListDeletedObjectsResponse {
  repeated Object objects = 1;
}

message PurgeObjectRequest {
  string id = 1;
}

message PurgeObjectResponse {}
