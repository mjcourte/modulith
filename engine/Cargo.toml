[workspace]
members = ["core", "renderer", "tools/headless"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Shared across members so versions can't drift between crates.
flatbuffers = "25"
anyhow = "1"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.34"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
# Our own code unoptimized (we want to debug it), dependencies optimized:
# a full debug build of lyon and flatbuffers makes headless too slow to
# reach for, which defeats the point of having it.
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
